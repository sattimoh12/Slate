<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slate">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Slate — Pre-production HQ</title>
<style>
:root{
  --bg:#0f1116;--panel:#161a22;--panel2:#1c212b;--panel3:#232936;
  --line:#2a3040;--text:#e7eaf0;--dim:#98a1b3;--dimmer:#6b7488;
  --accent:#7fd6c1;--accent-ink:#0f1116;--amber:#e5ae6b;
  --good:#82c08a;--warn:#dfa657;--bad:#d98d8d;--violet:#a99ae0;--r:12px;--r2:8px;
}
[data-theme="light"]{
  --bg:#f5f6f9;--panel:#fff;--panel2:#eef0f5;--panel3:#e4e8ef;
  --line:#dce0e9;--text:#171a21;--dim:#5b6474;--dimmer:#8b93a3;
  --accent:#1f9c86;--accent-ink:#fff;--amber:#b3771f;
  --good:#3f8a4c;--warn:#a8721f;--bad:#b1524f;--violet:#6f5fc0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
img{max-width:100%}

#app{display:flex;min-height:100vh}
#side{width:238px;flex:0 0 238px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#main{flex:1;min-width:0;padding:34px 40px 150px;max-width:1280px}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:9px}
.brand b{font-size:17px;letter-spacing:.4px}
.brand .clap{width:20px;height:20px;border-radius:4px;background:var(--accent);position:relative;flex:0 0 auto}
.brand .clap:after{content:"";position:absolute;inset:0 0 62% 0;background:var(--bg);
  -webkit-mask:repeating-linear-gradient(115deg,#000 0 6px,transparent 6px 11px);
  mask:repeating-linear-gradient(115deg,#000 0 6px,transparent 6px 11px)}
.projpick{margin:2px 12px 14px}
.projpick select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 10px}
nav{padding:0 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8.5px 11px;border-radius:var(--r2);color:var(--dim);text-align:left;font-size:14px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel3);color:var(--text);font-weight:600}
nav .ic{width:17px;text-align:center;opacity:.9;font-size:13px}
nav .cnt{margin-left:auto;font-size:11px;color:var(--dimmer);background:var(--panel2);padding:1px 7px;border-radius:20px}
nav button.on .cnt{background:var(--bg)}
.navlbl{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dimmer);padding:13px 12px 5px}
#navfoot{margin-top:auto;padding:10px;display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line)}
#navfoot button{flex:1;padding:6px 8px;border-radius:6px;color:var(--dimmer);font-size:12px;text-align:center}
#navfoot button:hover{background:var(--panel2);color:var(--text)}
#navfoot button.on{background:var(--panel3);color:var(--text)}
#sidefoot{padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dimmer)}
.ind{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto}
#sidefoot .brow{display:flex;gap:6px;margin-top:9px}
#sidefoot .brow button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px;font-size:11px;color:var(--dim)}
#sidefoot .brow button:hover{color:var(--text)}

h1{font-size:26px;letter-spacing:-.4px;margin-bottom:4px;font-weight:650}
h2{font-size:17px;margin-bottom:2px;font-weight:640}
h3{font-size:13.5px;font-weight:640}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:24px;max-width:66ch}
.head{margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.muted{color:var(--dim)}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.sect{margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sect h2{margin:0}
.sect .line{flex:1;height:1px;background:var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--dim);font-size:13.5px}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 14px;font-size:13.5px;color:var(--text);display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--panel3)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:620}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.gh{background:none;border-color:transparent;color:var(--dim)}
.btn.gh:hover{background:var(--panel2);color:var(--text)}
.btn.danger{color:var(--bad)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2.5px 9px;border-radius:20px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.pill.ess{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-color:transparent;font-weight:620}
.pill.rec{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber);border-color:transparent}
.pill.opt{background:var(--panel2);color:var(--dimmer)}
.pill.cond{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet);border-color:transparent}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:transparent}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);border-color:transparent}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--dim)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:620;box-shadow:0 1px 3px rgba(0,0,0,.25)}

.promise{border-left:3px solid var(--amber);background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 9%,transparent),transparent 60%)}
.onething{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 8%,var(--panel)),var(--panel))}
.onething .lbl{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:9px}
.onething .task{font-size:21px;line-height:1.35;font-weight:600;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-size:23px;font-weight:660;letter-spacing:-.5px}
.stat .l{font-size:11.5px;color:var(--dim);margin-top:1px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--panel2) 0);display:grid;place-items:center;position:relative}
.ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;font-size:11.5px;font-weight:660}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar i.over{background:var(--warn)}

.item{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.item+.item{margin-top:7px}
.item .grow{flex:1;min-width:0}
.item .ttl{font-size:14.5px}
.item.done .ttl{text-decoration:line-through;color:var(--dimmer)}
.chk{width:19px;height:19px;border:1.6px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:2px;display:grid;place-items:center;font-size:11px;color:transparent}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.item:hover .acts,.row:hover .acts,.frame:hover .acts,.shot:hover .acts,.thumb:hover .acts{opacity:1}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--panel2)}

.grp{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.grp>summary{padding:12px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--panel2);list-style:none;font-weight:620;font-size:14px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:before{content:"\203A";transition:transform .15s;color:var(--dim);font-size:17px}
.grp[open]>summary:before{transform:rotate(90deg)}
.grp>summary .n{margin-left:auto;font-size:12px;color:var(--dim);font-weight:400}
.crole{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.crole .main{flex:1;min-width:210px}
.crole .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crole .why{color:var(--dim);font-size:12.5px;margin-top:3px;max-width:64ch}
.crole .skip{color:var(--dimmer);font-size:12px;margin-top:3px;font-style:italic}
.crole .assign{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crole select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;max-width:170px}
.prepitem{padding:10px 15px;border-top:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.prepitem .t{flex:1;font-size:13.5px}
.prepitem.on .t{color:var(--dimmer);text-decoration:line-through}

.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.frame .im{aspect-ratio:16/9;background:var(--panel2);display:grid;place-items:center;overflow:hidden;position:relative}
.frame .im img{width:100%;height:100%;object-fit:cover;display:block}
.frame .im .ph{color:var(--dimmer);font-size:12px}
.frame .im .no{position:absolute;left:8px;top:8px;background:rgba(8,10,14,.8);color:#fff;
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.4px}
.frame .meta{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:7px}
.frame .desc{font-size:13px;line-height:1.45}
.frame .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--dim);font-size:13.5px;cursor:pointer}
.drop.hot{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--text)}

.shot{display:flex;gap:11px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.shot .no{width:46px;flex:0 0 auto;font-weight:700;font-size:13px;letter-spacing:.3px;padding-top:1px}
.shot .body{flex:1;min-width:0}
.shot .d{font-size:13.5px;line-height:1.45}
.shot.got .d{color:var(--dimmer);text-decoration:line-through}
.shot .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
body.shoot .shot{padding:16px 14px}
body.shoot .shot .chk{width:28px;height:28px;font-size:15px;margin-top:0}
body.shoot .shot .no{width:56px;font-size:16px}
body.shoot .shot .d{font-size:15.5px}
body.shoot .hideshoot{display:none!important}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.thumb{width:88px;height:60px;border-radius:8px;overflow:hidden;background:var(--panel2);position:relative;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .acts{position:absolute;right:3px;top:3px}
.thumb .acts button{background:rgba(8,10,14,.8);border-radius:6px;padding:1px 6px;font-size:11px;color:#fff}

table.dod{width:100%;border-collapse:collapse;font-size:12.5px}
table.dod th,table.dod td{border:1px solid var(--line);padding:6px 9px;text-align:center;white-space:nowrap}
table.dod th:first-child,table.dod td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
table.dod thead th{background:var(--panel2);font-weight:620}
table.dod td.x{color:var(--accent);font-weight:700}
.scrollx{overflow-x:auto}

#veil{position:fixed;inset:0;background:rgba(6,8,12,.68);display:none;place-items:center;z-index:60;padding:20px;backdrop-filter:blur(3px)}
#veil.on{display:grid}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;width:min(640px,100%);max-height:88vh;overflow:auto;padding:24px}
#modal h2{margin-bottom:16px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.f textarea{min-height:78px;resize:vertical;line-height:1.55}
.f .hint{font-size:11.5px;color:var(--dimmer);margin-top:4px}
.cg{display:flex;flex-wrap:wrap;gap:7px}
.cg label{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--text);cursor:pointer;margin:0}
.cg input{width:auto}
.modfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

#focus{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;display:none;align-items:center;gap:14px;box-shadow:0 10px 34px rgba(0,0,0,.4);max-width:min(400px,calc(100vw - 44px))}
#focus.on{display:flex}
#focus .t{font-size:27px;font-weight:660;letter-spacing:-.5px}
#focus .w{font-size:12px;color:var(--dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cap{position:fixed;left:260px;bottom:22px;z-index:50;background:var(--accent);color:var(--accent-ink);
  border-radius:30px;padding:11px 18px;font-weight:620;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.32)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:70;background:var(--panel3);
  border:1px solid var(--line);border-radius:10px;padding:11px 17px;font-size:13.5px;display:none;
  align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.35);max-width:min(600px,92vw)}
#toast.on{display:flex}
#toast button{color:var(--accent);font-weight:620;font-size:13px;white-space:nowrap}


.pline{display:block;width:100%;text-align:left;color:var(--dim);font-size:13px;padding:9px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:26px}
.pline:hover{color:var(--text)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:44px 34px;text-align:center;margin-bottom:26px}
.hero .lbl{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin-bottom:16px}
.hero .big{font-size:27px;line-height:1.3;font-weight:620;letter-spacing:-.4px;max-width:20ch;margin:0 auto 28px}
.btn.xl{padding:15px 34px;font-size:15.5px;border-radius:12px}
.hero .mini{display:flex;gap:20px;justify-content:center;margin-top:20px}
.hero .mini button{color:var(--dimmer);font-size:12.5px}
.hero .mini button:hover{color:var(--text)}
.qline{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:8px;font-size:13.5px}
.qline:hover{background:var(--panel2)}
.qline .arrow{margin-left:auto;color:var(--dimmer)}
.morebar{text-align:center;margin:30px 0 10px}
.arealist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.arearow{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.arearow:last-child{border-bottom:none}
.arearow:hover{background:var(--panel2)}
.arearow .nm{flex:1;font-size:13.5px}
.arearow .pr{width:56px;height:4px;border-radius:4px;background:var(--panel3);overflow:hidden;flex:0 0 auto}
.arearow .pr i{display:block;height:100%;background:var(--accent)}

/* timeline */
.tl{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 6px}
.tlg{display:grid;min-width:620px;align-items:stretch}
.tl .mh{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dimmer);padding:0 0 8px 7px;border-left:1px solid var(--line)}
.tl .mh.cur{color:var(--text);font-weight:640}
.tl .lb{position:sticky;left:0;z-index:3;background:var(--bg);padding:10px 10px 10px 0;border-bottom:1px solid var(--line)}
.tl .lb b{display:block;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .lb button{font-size:11px;color:var(--dimmer);padding:2px 0}
.tl .lb button:hover{color:var(--accent)}
.tl .lane{position:relative;height:78px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/var(--cw) 100% repeat-x}
.tl .ph{position:absolute;top:12px;height:24px;line-height:24px;border-radius:6px;font-size:11px;padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
  background:color-mix(in srgb,var(--c) 22%,transparent);border-left:3px solid var(--c)}
.tl .ph.past{opacity:.55}
.tl .ms{position:absolute;top:47px;width:11px;height:11px;transform:translate(-50%,0) rotate(45deg);
  background:var(--accent);border-radius:2px;border:none;padding:0;z-index:2}
.tl .ms.done{background:var(--dimmer)}
.tl .dy{position:absolute;top:49px;width:8px;height:8px;border-radius:50%;background:var(--amber);transform:translateX(-50%);border:none;padding:0;z-index:2}
.tl .dy.pk{background:var(--warn)}.tl .dy.rc{background:var(--violet)}
.tl .now{position:absolute;top:0;bottom:0;width:1px;background:var(--bad);z-index:1}
.tl .now:after{content:"";position:absolute;top:-1px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.up .mo{margin:22px 0 8px;display:flex;align-items:center;gap:12px}
.up .mo h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--dimmer)}
.up .mo .line{flex:1;height:1px;background:var(--line)}
.up .row{display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.up .row .d{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);width:58px;flex:0 0 auto}
.up .row .d.today{color:var(--bad);font-weight:640}
.up .row .k{width:14px;text-align:center;flex:0 0 auto;font-size:12px}
.up .row .t{flex:1;min-width:0;font-size:14px}
.up .row.done .t{text-decoration:line-through;color:var(--dimmer)}
.up .row .pj{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--panel2);color:var(--dim);border:1px solid var(--line);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}

<script>
/* ===== SLATE v3 — pre-production HQ. Starts the day the script is locked. ===== */
const TIERS=[
 {name:'Micro-budget short',blurb:'5-15 people. Favours, friends, borrowed kit. Roles double up.'},
 {name:'Funded short',blurb:'20-40 people. Real day rates, proper departments, insurance.'},
 {name:'Indie feature',blurb:'50+ people. Full hierarchy, possibly union, weeks of shooting.'}];
const LEVELS={3:{lbl:'Essential',cls:'ess'},2:{lbl:'Recommended',cls:'rec'},1:{lbl:'If you can',cls:'opt'},
 4:{lbl:'Required if applicable',cls:'cond'},0:{lbl:'Not yet',cls:'opt'}};

const CREW=[
{dept:'Production',roles:[
 {id:'producer',n:'Producer',t:[3,3,3],why:'Owns money, schedule, paperwork, and every promise made to anyone outside the set. Your partner, not your assistant.',skip:'You end up producing and directing at once, and the directing loses.'},
 {id:'lineprod',n:'Line Producer',t:[1,2,3],why:'Turns the script into a realistic budget and defends it daily.',skip:'You find out you cannot afford day 4 on day 4.'},
 {id:'upm',n:'Production Manager (UPM)',t:[1,2,3],why:'Runs the machine: bookings, hires, rentals, logistics.',skip:'The producer drowns and stops answering anyone.'},
 {id:'coord',n:'Production Coordinator',t:[0,2,3],why:'The office spine - call sheets out, everyone knows where to be.',skip:'People show up at the wrong place at the wrong time.'},
 {id:'accountant',n:'Production Accountant',t:[0,1,3],why:'Tracks every pound so the film can be audited, insured and delivered.',skip:'Funders and tax credits become impossible to satisfy.'},
 {id:'locmgr',n:'Location Manager',t:[1,3,3],why:'Finds, negotiates, permits and polices locations, and hands them back clean.',skip:'You get shut down mid-scene by an owner, council or police.'},
 {id:'casting',n:'Casting Director',t:[2,3,3],why:'Access to actors you cannot reach yourself, and an honest filter on your taste.',skip:'You cast from your friends list and the performances cap your film.'},
 {id:'pa',n:'Production Assistants',t:[2,3,3],why:'Lock-offs, runs, holding the public back, feeding people.',skip:'Heads of department do errands instead of their jobs.'}]},
{dept:'Direction',roles:[
 {id:'director',n:'Director',t:[3,3,3],why:'You. The only job that cannot be delegated or doubled up.',skip:'-'},
 {id:'ad1',n:'1st Assistant Director',t:[3,3,3],why:'The single most valuable hire on a small film. Builds the schedule, runs the floor, protects your focus, calls the day.',skip:'You run the clock yourself, which means you stop directing actors. The classic first-film mistake.'},
 {id:'ad2',n:'2nd Assistant Director',t:[0,2,3],why:'Cast wrangling, call sheets, background, paperwork.',skip:'The 1st AD is stuck in a van doing admin instead of on the floor.'},
 {id:'scriptsup',n:'Script Supervisor',t:[3,3,3],why:'Continuity, coverage, screen direction, and the notes your editor lives on. Wildly undervalued at this level.',skip:'You lose scenes in the edit that were never shot to cut together.'},
 {id:'dirasst',n:'Director’s Assistant',t:[0,1,2],why:'Holds your paper, your day, your reminders - external working memory on set.',skip:'You carry the whole day in your head and burn out by lunch.'}]},
{dept:'Camera',roles:[
 {id:'dp',n:'Director of Photography',t:[3,3,3],why:'Your closest creative collaborator. Owns image, lighting design and camera strategy.',skip:'There is no film. This is the one department you never economise on.'},
 {id:'camop',n:'Camera Operator',t:[1,2,3],why:'Operates so the DP can watch light and the whole frame.',skip:'On small jobs the DP operates - fine, but slower and more tiring.'},
 {id:'ac1',n:'1st AC / Focus Puller',t:[2,3,3],why:'Keeps it sharp, builds and maintains the camera.',skip:'Shooting wide open, half your takes are soft and you find out in post.'},
 {id:'ac2',n:'2nd AC / Clapper Loader',t:[1,2,3],why:'Slates, marks, media, camera reports.',skip:'Sync and labelling chaos for the editor.'},
 {id:'dit',n:'DIT / Data Wrangler',t:[2,3,3],why:'Two backups of every card before anyone sleeps. Non-negotiable in practice.',skip:'One dropped card and the day is gone forever. This has ended films.'},
 {id:'gimbal',n:'Gimbal / Steadicam Op',t:[0,1,2],why:'Specialist movement.',skip:'Rewrite the move or go handheld.'},

{dept:'Lighting & Grip',roles:[

 {id:'grips',n:'Grips / Dolly Grip',t:[1,2,3],why:'Moves and stabilises everything, executes dolly moves.',skip:'Your movement vocabulary shrinks to handheld and sticks.'}]},
{dept:'Sound',roles:[

 {id:'boom',n:'Boom Operator',t:[2,3,3],why:'Frees the mixer to actually mix and monitor.',skip:'A one-person sound department that is always compromising something.'},
 {id:'sndutil',n:'Sound Utility',t:[0,1,2],why:'Radio mics, cable, second boom.',skip:'Slower turnarounds on complex scenes.'}]},
{dept:'Art Department',roles:[
 {id:'pd',n:'Production Designer',t:[3,3,3],why:'The world of the film. On a small budget this is where perceived value is won or lost.',skip:'Your film looks like the rooms you happened to have access to.'},

 {id:'setdec',n:'Set Decorator',t:[1,2,3],why:'Everything in the space that is not built.',skip:'Sets read as empty or generic.'},
 {id:'props',n:'Props Master',t:[2,3,3],why:'Every object an actor touches, plus continuity on all of them.',skip:'Scenes stall while someone hunts for the letter the character reads.'},
 {id:'dresser',n:'Set Dresser / Art PA',t:[1,2,3],why:'Muscle and speed for the art department.',skip:'Turnarounds between setups get very long.'}]},
{dept:'Costume, Hair & Make-up',roles:[
 {id:'costume',n:'Costume Designer',t:[2,3,3],why:'Character told through clothing, plus continuity and doubles.',skip:'Actors wear their own clothes and the characters blur together.'},
 {id:'wardrobe',n:'Wardrobe Supervisor',t:[0,2,3],why:'On-set continuity, repairs, laundry, changes.',skip:'Continuity errors appear in half your cuts.'},
 {id:'hmu',n:'Hair & Make-up Artist',t:[3,3,3],why:'Even a no-make-up look needs someone managing sweat, shine and continuity across days.',skip:'Faces shift between shots and skin blows out under lights.'},
 {id:'sfxmu',n:'SFX Make-up Artist',t:[4,4,4],why:'Any blood, wounds, ageing or prosthetics.',skip:'It looks fake, and that is the shot people remember.'}]},
{dept:'Post-production (book them now, not later)',roles:[
 {id:'editor',n:'Editor',t:[3,3,3],why:'The final rewrite. Attach them in prep so they can flag the coverage they will need before you shoot it.',skip:'You cut your own film and cannot see it any more. Especially dangerous for a perfectionist.'},
 {id:'assted',n:'Assistant Editor',t:[0,2,3],why:'Ingest, sync, organise, conform, deliverables.',skip:'The editor spends the first week filing instead of cutting.'},

 {id:'snddes',n:'Sound Designer',t:[2,3,3],why:'Builds the world you did not have the budget to shoot.',skip:'The film feels thin and small.'},
 {id:'mixer2',n:'Re-recording Mixer',t:[2,3,3],why:'The final mix that meets festival and broadcast spec.',skip:'Rejected on technical delivery, or dialogue nobody can hear.'},

{dept:'Safety, Legal & Support',roles:[

 {id:'transport',n:'Transport Captain',t:[0,1,3],why:'Vehicles, unit moves, parking.',skip:'Company moves eat hours you scheduled for shooting.'},
 {id:'childchap',n:'Child Chaperone / Tutor',t:[4,4,4],why:'Legally required for minors on set.',skip:'Illegal, and insurance is void.'}]}];

function blank(){return{v:3,activeProject:null,projects:[],people:[],inbox:[],theme:'dark',

function newProject(t){return{id:uid(),title:t||'Untitled film',logline:'',tier:0,phase:0,
  promise:{to:'',what:'',why:'',told:''},tasks:[],crew:{},characters:[],scenes:[],shots:[],
  locations:[],days:[],budget:[],budgetTotal:'',contingencyPct:10,minPerSetup:30,prep:{},needsMe:{},owners:{},phaseDates:{},created:today()}}

function migrate(p){
  p.characters=p.characters||[];p.scenes=p.scenes||[];p.locations=p.locations||[];
  p.days=p.days||[];p.budget=p.budget||[];p.crew=p.crew||{};p.tasks=p.tasks||[];p.prep=p.prep||{};p.owners=p.owners||{};p.needsMe=p.needsMe||{};
  if(p.minPerSetup==null)p.minPerSetup=30;
  if(p.contingencyPct==null)p.contingencyPct=10;
  if(p.budgetTotal==null)p.budgetTotal='';
  if(!p.shots){                                   /* v2 board -> v3 shots */
    p.shots=(p.board||[]).map((f,i)=>({id:f.id||uid(),scene:f.scene||'',setup:'',size:f.size||'—',
      angle:'',move:f.move||'Static',lens:f.lens||'',subject:'',desc:f.desc||'',
      priority:'should',img:f.img||'',got:false,order:i}));
  }
  delete p.board; delete p.writing;
  p.scenes.forEach(s=>{ s.flags=s.flags||[]; if(!Array.isArray(s.cast)) { s.castNotes=s.cast||s.castNotes||''; s.cast=[]; } });
  p.locations.forEach(l=>{ l.checks=l.checks||[]; l.photos=l.photos||[]; });
  p.days.forEach(d=>{ d.sceneIds=d.sceneIds||[]; d.type=d.type||'Shoot'; });
  p.shots.forEach((s,i)=>{ if(s.order==null)s.order=i; if(!s.priority)s.priority='should'; });
  p.phaseDates=p.phaseDates||{};
  return p;
}
function load(){
  try{const raw=localStorage.getItem(KEY)||localStorage.getItem('slate.v2');S=raw?JSON.parse(raw):blank();}
  catch(e){S=blank();memOnly=true;}
  if(!S||!S.projects)S=blank();
  S.projects=S.projects.map(migrate);
  if(!S.projects.length){
    const p=newProject('My first film');
    p.tasks=[{id:uid(),title:'Break the script down scene by scene',energy:'high',done:false,created:today()},
      {id:uid(),title:'Tell the person you promised that the script is locked',energy:'low',done:false,created:today()},
      {id:uid(),title:'Connect the iCloud backup folder',energy:'low',done:false,created:today()}];
    S.projects.push(p);S.activeProject=p.id;
  }
  if(!S.projects.find(p=>p.id===S.activeProject))S.activeProject=S.projects[0].id;
  seedPlan();
  streakCheck();
}

    p.tasks.push({id:uid(),title,energy:'none',done:false,created:today(),due,milestone:true});};

  ms(pt,'2027-01-31','Picture lock');
  day(pt,'2026-10-10','Recce','','Tech scout Selchower Str. / Hermannstr. / Briesestr.');
  day(pt,'2026-10-15','Shoot','07:00','Street permit day 1 — Erlaubnis Film 08-2026-01765');
  day(pt,'2026-10-16','Shoot','07:00','Street permit day 2');
  day(pt,'2026-10-17','Pick-ups','','Buffer / non-street pickups (confirm whether permit covers the 17th)');
  if(nk.phase<7)nk.phase=7;
  Object.assign(nk.phaseDates,{7:'2026-09-06',8:'2026-11-09',9:'2026-12-01'});
  ms(nk,'2026-10-04','Assembly complete (then frozen until Oct 26)');

/* ---------------- local image store (IndexedDB, memory fallback) ---------------- */
let _db=null,_mem=new Map(),_idbOK=true;
function idb(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  if(!_idbOK||!window.indexedDB)return rej();
  let r;try{r=indexedDB.open('slate-media',1);}catch(e){_idbOK=false;return rej();}
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('img'))r.result.createObjectStore('img');};
  r.onsuccess=()=>{_db=r.result;res(_db);};r.onerror=()=>{_idbOK=false;rej();};});}
async function imgPut(k,v){try{const d=await idb();return new Promise((res,rej)=>{
  const t=d.transaction('img','readwrite');t.objectStore('img').put(v,k);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}catch(e){_mem.set(k,v);}}
async function imgGet(k){try{const d=await idb();return await new Promise((res,rej)=>{
  const q=d.transaction('img','readonly').objectStore('img').get(k);
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return _mem.get(k);}}
async function imgDel(k){try{const d=await idb();return new Promise(res=>{
  const t=d.transaction('img','readwrite');t.objectStore('img').delete(k);t.oncomplete=()=>res();});}
  catch(e){_mem.delete(k);}}
async function imgKeys(){try{const d=await idb();return await new Promise((res,rej)=>{
  const q=d.transaction('img','readonly').objectStore('img').getAllKeys();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}catch(e){return [..._mem.keys()];}}

function liveKeys(){
  const set=new Set();
  S.projects.forEach(p=>{
    (p.shots||[]).forEach(f=>{if(f.img)set.add(f.img);});
    (p.locations||[]).forEach(l=>(l.photos||[]).forEach(k=>set.add(k)));
  });
  return set;
}
async function prune(){
  const live=liveKeys();let n=0;
  for(const k of await imgKeys()) if(String(k).startsWith('img_') && !live.has(k)){await imgDel(k);n++;}
  return n;
}
function shrink(file,max,q){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const im=new Image();im.onerror=rej;
    im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
      cx.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};
    im.src=fr.result;};
  fr.readAsDataURL(file);});}
function hydrateImages(){
  document.querySelectorAll('img[data-img]').forEach(async el=>{
    if(el.dataset.loaded)return;
    let d=await imgGet(el.dataset.img);
    if(!d){d=await sbGetImage(el.dataset.img);if(d)await imgPut(el.dataset.img,d);}
    if(d){el.src=d;el.dataset.loaded='1';}});}

/* ---------------- iCloud folder sync (File System Access API) ---------------- */
const HANDLE_KEY='__cloudHandle';
let dirHandle=null,cloudState='off',cloudAt=null,cloudTimer=null,cloudBusy=false;
const cloudSupported=()=>typeof window.showDirectoryPicker==='function';

async function ensurePerm(h,ask){
  try{
    const o={mode:'readwrite'};
    if(await h.queryPermission(o)==='granted')return true;
    if(ask&&await h.requestPermission(o)==='granted')return true;
  }catch(e){}
  return false;
}
async function cloudConnect(){
  if(!cloudSupported())
    return toast('This browser cannot write to a folder. Use Chrome, and open Slate through "Start Slate.command".');
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite',id:'slate-icloud'});
    dirHandle=h; await imgPut(HANDLE_KEY,h);
    cloudState='on'; updateCloudUI();
    const remote=await cloudRead();
    if(remote&&remote.savedAt&&(!S.savedAt||remote.savedAt>S.savedAt)){
      toast('That folder has a newer copy of your work.','Load it',async()=>{await cloudLoad(remote);});
    }else{ await cloudWrite(); }
    render();
  }catch(e){ if(e&&e.name!=='AbortError') toast('Could not connect that folder.'); }
}
async function cloudRestore(){
  if(!cloudSupported())return;
  try{
    const h=await imgGet(HANDLE_KEY);
    if(!h)return;
    dirHandle=h;
    cloudState=await ensurePerm(h,false)?'on':'needperm';
    updateCloudUI();
    if(cloudState==='on'){
      const remote=await cloudRead();
      if(remote&&remote.savedAt&&(!S.savedAt||remote.savedAt>S.savedAt))
        toast('The iCloud copy is newer than this device.','Load it',async()=>{await cloudLoad(remote);});
    }
  }catch(e){}
}
async function dataDir(){ return dirHandle.getDirectoryHandle('data',{create:true}); }
async function cloudRead(){
  try{
    const d=await dataDir();
    const f=await(await d.getFileHandle('slate.json')).getFile();
    return JSON.parse(await f.text());
  }catch(e){ return null; }
}
async function cloudLoad(remote){
  try{
    const d=await dataDir();
    const imgs=await d.getDirectoryHandle('images',{create:true});
    for await(const [name,h] of imgs.entries()){
      if(!name.endsWith('.jpg'))continue;
      const key=name.slice(0,-4);
      if(await imgGet(key))continue;
      const blob=await(await h.getFile()).arrayBuffer();
      const b64=btoa(String.fromCharCode(...new Uint8Array(blob)));
      await imgPut(key,'data:image/jpeg;base64,'+b64);
    }
    S=remote; S.projects=S.projects.map(migrate); save(); render();
    toast('Loaded from iCloud.');
  }catch(e){ toast('Could not read the iCloud copy.'); }
}
function queueCloud(){
  if(!dirHandle||cloudState==='off')return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudWrite,12000);
}
async function cloudWrite(){
  if(!dirHandle||cloudBusy)return;
  cloudBusy=true;
  try{
    if(!await ensurePerm(dirHandle,false)){cloudState='needperm';updateCloudUI();cloudBusy=false;return;}
    const d=await dataDir();
    const fh=await d.getFileHandle('slate.json',{create:true});
    const w=await fh.createWritable(); await w.write(JSON.stringify(S)); await w.close();
    const imgs=await d.getDirectoryHandle('images',{create:true});
    const live=liveKeys(), have=new Set();
    for await(const [name] of imgs.entries()) have.add(name);
    for(const k of live){
      if(have.has(k+'.jpg'))continue;
      const data=await imgGet(k); if(!data)continue;
      const blob=await(await fetch(data)).blob();
      const f=await imgs.getFileHandle(k+'.jpg',{create:true});
      const ww=await f.createWritable(); await ww.write(blob); await ww.close();
    }
    for(const name of have){
      if(!name.endsWith('.jpg'))continue;
      if(!live.has(name.slice(0,-4))) await imgs.removeEntry(name).catch(()=>{});
    }
    cloudAt=new Date(); cloudState='on';
  }catch(e){ cloudState='error'; }
  cloudBusy=false; updateCloudUI();
}
function updateCloudUI(){
  const t=document.getElementById('cloudtxt'),d=document.getElementById('clouddot');
  if(!t)return;
  const map={off:['iCloud not connected','var(--dimmer)'],
    on:[cloudAt?'iCloud · '+cloudAt.toTimeString().slice(0,5):'iCloud connected','var(--good)'],
    needperm:['iCloud · click to re-allow','var(--warn)'],
    error:['iCloud · write failed','var(--bad)']};
  const [txt,col]=map[cloudState]||map.off;
  t.textContent=txt; d.style.background=col;
}

    if(f.type==='textarea')h+='<textarea data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
    else if(f.type==='select')h+='<select data-k="'+f.k+'">'+f.opts.map(o=>{
      const val=Array.isArray(o)?o[0]:o,lbl=Array.isArray(o)?o[1]:o;
      return '<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lbl)+'</option>';}).join('')+'</select>';
    else if(f.type==='checkgroup'){
      const on=Array.isArray(v)?v:[];
      h+='<div class="cg" data-k="'+f.k+'">'+f.opts.map(o=>{

/* ---------------- delegation ---------------- */
function owner(p,key){return p.owners[key]||{status:'mine',person:'',note:''};}
function delegated(p,key){return owner(p,key).status==='delegated';}
function ownerName(p,key){
  const o=owner(p,key);const per=S.people.find(x=>x.id===o.person);
  return per?per.name:(o.person?'someone':'');
}
function areaOfDept(dept){return DEPT_AREA[dept]||'crew';}
function needsMe(p,k){return !!p.needsMe[k];}

/* ---------------- derived ---------------- */
function prepStats(p){
  let mine=0,mineDone=0,handed=0,handedDone=0;
  PREP.forEach(a=>{
    const off=delegated(p,a.key);
    a.items.forEach((it,ii)=>{
      const k=a.key+'.'+ii,done=!!p.prep[k];
      if(off&&!needsMe(p,k)){handed++;if(done)handedDone++;}
      else{mine++;if(done)mineDone++;}
    });
  });
  return {done:mineDone,total:mine,handed,handedDone};
}
function myOpenItems(p){
  const out=[];
  PREP.forEach(a=>{
    const off=delegated(p,a.key);
    a.items.forEach((it,ii)=>{
      const k=a.key+'.'+ii;
      if(p.prep[k])return;
      if(off&&!needsMe(p,k))return;
      out.push({k,text:it,area:a.area,areaKey:a.key,starred:needsMe(p,k),handed:off});
    });
  });
  return out;
}
function crewFor(tier){const out=[];
  CREW.forEach(g=>{const roles=g.roles.filter(r=>r.t[tier]>0);if(roles.length)out.push({dept:g.dept,roles});});
  return out;}
function essentialStats(p){
  const need=[],have=[];
  CREW.forEach(g=>g.roles.forEach(r=>{
    if(r.t[p.tier]===3&&r.id!=='director'){need.push(r);
      const c=p.crew[r.id];if(c&&(c.status==='confirmed'||c.status==='held'))have.push(r);}}));
  return {need:need.length,have:have.length,missing:need.filter(r=>!have.includes(r))};
}
function setupCount(shots){
  const s=new Set();
  shots.forEach(x=>s.add(x.setup&&x.setup.trim()?x.scene+'|'+x.setup.trim().toLowerCase():'solo|'+x.id));
  return s.size;
}
const hhmm=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec((t||'').trim());return m?(+m[1])*60+(+m[2]):null;};
function dayLoad(p,d){
  const ids=d.sceneIds||[];
  const scenes=ids.map(id=>p.scenes.find(s=>s.id===id)).filter(Boolean);
  const shots=p.shots.filter(sh=>ids.includes(sh.scene));
  const setups=setupCount(shots);
  const pages=scenes.reduce((a,s)=>a+(parseFloat(s.pages)||0),0);
  const mins=setups*(p.minPerSetup||30);
  const cast=[...new Set(scenes.flatMap(s=>s.cast||[]))];
  const locs=[...new Set(scenes.map(s=>s.location).filter(Boolean))];
  const flags=[...new Set(scenes.flatMap(s=>s.flags||[]))];
  let dayMins=null;const c=hhmm(d.call),w=hhmm(d.wrap);
  if(c!=null&&w!=null)dayMins=(w>c?w-c:w+1440-c);
  return {scenes,shots,setups,pages,mins,cast,locs,flags,dayMins,
    over:dayMins!=null&&mins>dayMins*0.7};
}
function requiredSpecialists(p){
  const map={};
  p.scenes.forEach(s=>(s.flags||[]).forEach(f=>(FLAG_ROLES[f]||[]).forEach(rid=>{
    map[rid]=map[rid]||{role:ROLE_BY_ID[rid],scenes:[],flags:new Set()};
    map[rid].scenes.push(s.no||s.heading||'?');map[rid].flags.add(f);})));
  return Object.entries(map).map(([rid,v])=>({rid,...v,flags:[...v.flags],
    held:['confirmed','held'].includes((p.crew[rid]||{}).status)}));
}
function warnings(p){
  const w=[],add=(t,area,v,act)=>{if(!area||!delegated(p,area))w.push({t,v,act});};
  requiredSpecialists(p).filter(x=>!x.held).forEach(x=>
    w.push({t:x.role.n+' is required — scenes '+x.scenes.slice(0,4).join(', ')+' are flagged '+x.flags.join(', '),
      v:'bad',act:'crew'}));               /* safety never hides, delegated or not */
  const noLoc=p.scenes.filter(s=>!s.location).length;
  if(noLoc)add(noLoc+' scene'+(noLoc>1?'s have':' has')+' no location',
    'locations','warn','scenes');
  const noShots=p.scenes.filter(s=>!p.shots.some(x=>x.scene===s.id)).length;
  if(noShots)add(noShots+' scene'+(noShots>1?'s have':' has')+' no shots listed',
    'shot-list-storyboards','warn','shots');
  const unconf=p.characters.filter(c=>c.status!=='confirmed'&&c.status!=='passed').length;
  if(unconf)add(unconf+' character'+(unconf>1?'s are':' is')+' not cast yet','casting','warn','cast');
  const noContract=p.characters.filter(c=>c.status==='confirmed'&&!c.contract).length;
  if(noContract)add(noContract+' confirmed actor'+(noContract>1?'s have':' has')+' no contract signed',
    'casting','warn','cast');
  const noFit=p.characters.filter(c=>c.status==='confirmed'&&!c.fitting).length;
  if(noFit)add(noFit+' actor'+(noFit>1?'s have':' has')+' had no costume fitting',
    'costume-hair-make-up','warn','cast');
  p.days.filter(d=>d.type==='Shoot').forEach(d=>{
    const L=dayLoad(p,d);
    if(L.over)add(d.date+' has '+L.setups+' setups — roughly '+Math.round(L.mins/60)+'h of shooting in a '
      +Math.round(L.dayMins/60)+'h day','schedule-call-sheets','warn','sched');
  });
  const unlocked=p.locations.filter(l=>l.status!=='Locked'&&l.status!=='Rejected'
    &&p.scenes.some(s=>s.location===l.id)).length;
  if(unlocked)add(unlocked+' location'+(unlocked>1?'s are':' is')+' in use but not locked',
    'locations','warn','places');
  const days=S.lastManualBackup?Math.round((Date.now()-new Date(S.lastManualBackup))/864e5):null;
  if(cloudState!=='on'&&(days===null||days>7))
    w.push({t:cloudState==='needperm'?'iCloud backup needs re-allowing':(sbOn()?'iCloud backup not connected on this device':'Nothing is backed up yet — set up sync'),
      v:'warn',act:'guide'});
  return w;
}

const stat=(n,l)=>'<div class="stat"><div class="n mono">'+n+'</div><div class="l">'+esc(l)+'</div></div>';
const greeting=()=>{const h=new Date().getHours();
  return h<5?'Still up.':h<12?'Morning.':h<18?'Afternoon.':h<23?'Evening.':'Late one.';};
const daysAgo=d=>Math.round((Date.now()-new Date(d))/864e5);
const sceneLabel=s=>(s.no?s.no+'. ':'')+[s.intext,s.heading,s.dayNight].filter(Boolean).join(' — ');
const charName=(p,id)=>{const c=p.characters.find(x=>x.id===id);return c?c.name:'?';};

/* ---------------- RIGHT NOW — one job, nothing else ---------------- */
function qline(v,txt,act,go){
  return '<button class="qline" data-act="'+act+'"'+(go?' data-v="'+go+'"':'')+'>'
   +'<span class="pill '+v+'">'+(v==='bad'?'must fix':v==='cond'?'you':'check')+'</span>'
   +'<span style="flex:1">'+esc(txt)+'</span><span class="arrow">›</span></button>';
}
function vNow(){
  const p=P();
  const open=p.tasks.filter(t=>!t.done);
  const one=open.find(t=>t.pinned)||open.find(t=>!t.milestone)||open[0];
  const mine=myOpenItems(p);
  const starred=mine.filter(x=>x.starred&&x.handed);
  const warn=warnings(p),must=warn.filter(w=>w.v==='bad'),check=warn.filter(w=>w.v!=='bad');
  const pr=p.promise;
  let h='';

  h+=pr.to
   ? '<button class="pline" data-act="promise">For <b>'+esc(pr.to)+'</b>'
     +(pr.told?' · last told them '+daysAgo(pr.told)+' days ago':'')+'</button>'
   : '<button class="pline" data-act="promise">Who are you making this for? →</button>';

  h+='<div class="hero">';
  if(one){
    h+='<div class="lbl">The one thing</div><div class="big">'+esc(one.title)+'</div>'
     +'<button class="btn pri xl" data-act="focus" data-m="25" data-t="'+one.id+'">Start 25 minutes</button>'
     +'<div class="mini"><button data-act="toggle-task" data-t="'+one.id+'">Done</button>'
     +'<button data-act="skip-one" data-t="'+one.id+'">Not this</button>'
     +'<button data-act="onemore" data-t="'+one.id+'">More</button></div>';
  }else if(mine.length){
    h+='<div class="lbl">Next on your list</div><div class="big">'+esc(mine[0].text)+'</div>'
     +'<button class="btn pri xl" data-act="prep-task" data-k="'+mine[0].k+'">Make it a task</button>'
     +'<div class="mini"><button data-act="prep-tick" data-k="'+mine[0].k+'">Already done</button>'
     +'<button data-act="go" data-v="prep">See the list</button></div>';
  }else{
    h+='<div class="lbl">Nothing left</div><div class="big">You are clear.</div>'
     +'<button class="btn pri xl" data-act="task-new">Add something</button>';
  }
  h+='</div>';

  if(must.length) h+=qline('bad',must[0].t,'go',must[0].act);
  if(must.length>1) h+=qline('bad',(must.length-1)+' more that must be fixed','go','crew');
  if(starred.length) h+=qline('cond',starred.length===1?starred[0].text:starred.length+' decisions still need you','go','prep');
  const inb=S.inbox.filter(i=>!i.done);
  if(inb.length) h+=qline('','Sort '+inb.length+' brain dump note'+(inb.length>1?'s':''),'triage');
  if(check.length) h+=qline('warn',check.length===1?check[0].t:check.length+' things worth a look','more');

  h+='<div class="morebar"><button class="btn gh" data-act="more">'+(showMore?'Show less':'Show me everything')+'</button></div>';
  if(!showMore) return h;

  const es=essentialStats(p),ps=prepStats(p);
  const next=p.days.filter(d=>d.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(check.length){
    h+='<div class="sect"><h2>Worth a look</h2><div class="line"></div></div><div class="card">'
     +check.map(x=>'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 0">'
       +'<span style="flex:1;min-width:200px;font-size:13.5px">'+esc(x.t)+'</span>'
       +'<button class="btn sm gh" data-act="go" data-v="'+x.act+'">Open</button></div>').join('')+'</div>';
  }
  if(inb.length){
    h+='<div class="sect"><h2>Brain dump</h2><div class="line"></div></div>'
     +inb.slice(0,8).map(i=>'<div class="item"><div class="grow"><div class="ttl">'+esc(i.text)+'</div></div>'
      +'<div class="acts"><button class="btn sm" data-act="inbox-task" data-i="'+i.id+'">→ Task</button>'
      +'<button class="btn sm" data-act="inbox-person" data-i="'+i.id+'">→ Person</button>'
      +'<button class="btn sm" data-act="inbox-place" data-i="'+i.id+'">→ Location</button>'
      +'<button class="btn sm gh danger" data-act="inbox-del" data-i="'+i.id+'">✕</button></div></div>').join('');
  }
  const handed=AREA_KEYS.filter(k=>delegated(p,k));
  if(handed.length) h+='<div class="sect"><h2>Not your problem</h2><div class="line"></div></div>'
   +'<div class="card"><div class="chips">'+handed.map(k=>{const nm=ownerName(p,k);
     return '<span class="pill good">'+esc(AREA_BY_KEY[k].area)+(nm?' · '+esc(nm):'')+'</span>';}).join('')+'</div></div>';

  h+='<div class="sect"><h2>Where things are</h2><div class="line"></div></div>'
   +'<div class="grid g3">'+stat(ps.done+'/'+ps.total,'your prep items')
   +stat(es.have+'/'+es.need,'essential crew')
   +stat(p.characters.filter(c=>c.status==='confirmed').length+'/'+p.characters.length,'roles cast')+'</div>';
  if(next) h+='<div class="card" style="margin-top:14px"><h3>Next: '+esc(next.type||'Shoot')+' '+esc(next.date)+'</h3>'
   +'<div class="btnrow" style="margin-top:11px">'
   +(next.type==='Shoot'?'<button class="btn sm pri" data-act="callsheet" data-d="'+next.id+'">Call sheet</button>':'')
   +'<button class="btn sm" data-act="go" data-v="sched">Schedule</button></div></div>';
  h+='<div class="card" style="margin-top:14px"><h3>'+esc(PHASES[p.phase])+'</h3>'
   +'<div class="btnrow" style="margin-top:11px">'+PHASES.map((ph,i)=>
     '<button class="btn sm'+(i===p.phase?' pri':' gh')+'" data-act="phase" data-p="'+i+'">'+esc(ph)+'</button>').join('')+'</div></div>';
  return h;
}

    const items=a.items.map((t,i)=>({t,k:prepOpen+'.'+i}));

     +'<div class="chips" style="margin-top:8px">'

     +'<button class="btn sm gh" data-act="own" data-a="'+prepOpen+'">Change who owns this</button></div></div>';

     +'<div class="btnrow" style="margin-top:14px;justify-content:center"><button class="btn sm" data-act="showarea">Show it anyway</button></div></div>';
    else{
      h+='<div class="arealist">'+shown.map(x=>{

         +'<button class="chk'+(on?' on':'')+'" data-act="prep-tick" data-k="'+x.k+'">✓</button>'
         +'<div class="t">'+esc(x.t)+(star?' <span class="pill cond">needs you</span>':'')+'</div>'
         +'<div class="acts"><button class="btn sm gh" data-act="prep-star" data-k="'+x.k+'">'+(star?'★':'☆')+'</button>'

   /* was a completion ring. Prep is exactly where being behind is felt, and a
      percentage makes an ordinary Tuesday look like a shortfall. The count of
      what still needs you goes down as you work and never implies a target. */
   +'<div class="mono" style="font-size:34px;font-weight:660;letter-spacing:-1px;line-height:1;min-width:1.6ch;text-align:right">'+(ps.total-ps.done)+'</div>'
   +'<div style="flex:1"><h3>'+(ps.total-ps.done===0?'nothing needs you':ps.total-ps.done===1?'thing needs you':'things need you')+'</h3>'
   +'<div class="tiny muted" style="margin-top:3px">'
   +(ps.handed?ps.handed+' handed over':'nothing handed over yet')
   +(ps.done?' · '+ps.done+' done':'')+'</div></div></div>'
   +'<div class="arealist">'+PREP.map(a=>{
    const o=owner(p,a.key),nm=ownerName(p,a.key),off=o.status==='delegated';
    const items=a.items.map((_,i)=>a.key+'.'+i);

     +'<span class="arrow">›</span></button>';}).join('')+'</div>';

/* ---------------- TASKS ---------------- */
function vTasks(){
  const p=P();

/* ---------------- SHOT LIST ---------------- */
function shotNo(p,f){
  const sc=p.scenes.find(s=>s.id===f.scene);
  const n=p.shots.filter(x=>x.scene===f.scene).indexOf(f);
  const i=n<0?0:n;
  return (sc&&sc.no?sc.no:'')+String.fromCharCode(65+i%26)+(i>=26?String(Math.floor(i/26)+1):'');
}
function vShots(){
  const p=P();
  const list=p.shots.filter(f=>shotScene==='all'||f.scene===shotScene);
  const got=list.filter(f=>f.got).length;
  const byP=k=>list.filter(f=>f.priority===k).length;

  let h='<div class="head"><h1>Shot list</h1>'
   +'<div class="sub">Every shot. Mark what gets dropped first, calmly, now.</div></div>';

  h+='<div class="btnrow hideshoot" style="margin-bottom:14px">'
   +'<button class="btn pri" data-act="shot-new">＋ Add shot</button>'
   +'<button class="btn" data-act="shot-print">Printable shot list</button>'
   +'<button class="btn'+(shootMode?' pri':'')+'" data-act="shootmode">Shoot mode</button></div>';
  if(shootMode)h+='<div class="btnrow" style="margin-bottom:14px"><button class="btn pri" data-act="shootmode">Leave shoot mode</button></div>';

  if(p.scenes.length)h+='<div class="seg" style="margin-bottom:16px">'
   +'<button data-act="shots-scene" data-s="all" class="'+(shotScene==='all'?'on':'')+'">All</button>'
   +p.scenes.map(s=>'<button data-act="shots-scene" data-s="'+s.id+'" class="'+(shotScene===s.id?'on':'')+'">'
     +esc(s.no?'Sc '+s.no:(s.heading||'Scene'))+'</button>').join('')+'</div>';

  if(!p.shots.length)return h+'<div class="empty">No shots yet. Add them scene by scene, or upload storyboard frames — those become shots automatically.</div>';

  const setups=setupCount(list),mins=setups*(p.minPerSetup||30);
  h+='<div class="grid g3 hideshoot" style="margin-bottom:18px">'
   +stat(list.length,'shots')+stat(setups,'setups')
   +stat(Math.floor(mins/60)+'h '+(mins%60)+'m','rough shooting time')
   +stat(byP('must')+' / '+byP('should')+' / '+byP('spare'),'must / should / spare')+'</div>';
  if(shootMode)h+='<div class="card" style="margin-bottom:14px"><h3>Got '+got+' of '+list.length+'</h3>'
   +'<div class="bar" style="margin-top:8px"><i style="width:'+(list.length?got/list.length*100:0)+'%"></i></div></div>';

  const groups=(shotScene==='all'?p.scenes.map(s=>s.id):[shotScene]).concat(['']);
  groups.forEach(sid=>{
    const sc=p.scenes.find(s=>s.id===sid);
    const items=list.filter(f=>f.scene===sid);
    if(!items.length)return;
    const su=setupCount(items),mn=su*(p.minPerSetup||30);
    h+='<details class="grp" open><summary>'+esc(sc?sceneLabel(sc):'Not assigned to a scene')
     +'<span class="n">'+items.length+' shots · '+su+' setups · ~'+Math.floor(mn/60)+'h'+(mn%60?' '+(mn%60)+'m':'')+'</span></summary>';
    items.forEach(f=>{
      h+='<div class="shot'+(f.got?' got':'')+'">'
       +'<button class="chk'+(f.got?' on':'')+'" data-act="shot-got" data-f="'+f.id+'">✓</button>'
       +'<div class="no mono">'+esc(shotNo(p,f))+'</div>'
       +'<div class="body"><div class="d">'+esc(f.desc||f.subject||'No description')+'</div>'
       +'<div class="chips hideshoot" style="margin-top:6px">'
         +(f.size&&f.size!=='—'?'<span class="pill ess">'+esc(f.size)+'</span>':'')
         +(f.angle?'<span class="pill">'+esc(f.angle)+'</span>':'')
         +(f.move&&f.move!=='Static'?'<span class="pill">'+esc(f.move)+'</span>':'')
         +(f.lens?'<span class="pill">'+esc(f.lens)+'</span>':'')
         +(f.setup?'<span class="pill">setup: '+esc(f.setup)+'</span>':'')
         +(f.img?'<span class="pill good">boarded</span>':'')+'</div></div>'
       +'<div class="side"><span class="pill '+PRIORITY[f.priority].cls+'">'+PRIORITY[f.priority].lbl+'</span>'
       +'<div class="acts hideshoot"><button class="btn sm gh" data-act="shot-edit" data-f="'+f.id+'">Edit</button>'
       +'<button class="btn sm gh danger" data-act="shot-del" data-f="'+f.id+'">✕</button></div></div></div>';
    });
    h+='</details>';
  });
  h+='<div class="muted tiny hideshoot" style="margin-top:18px;max-width:66ch">Setups, not shots, are what eat a day — four shots from one camera position cost far less than one shot from four. If the estimate is over about seventy per cent of your day length, the schedule is lying to you.</div>';
  return h;
}

/* ---------------- STORYBOARD ---------------- */
function vBoard(){
  const p=P();
  const frames=p.shots.filter(f=>(boardScene==='all'||f.scene===boardScene));

     +(f.img?'<img data-img="'+f.img+'" alt="">':'<span class="ph">no image</span>')+'</div>'
     +'<div class="meta"><div class="chips">'
       +(f.size&&f.size!=='—'?'<span class="pill ess">'+esc(f.size)+'</span>':'')
       +(f.move&&f.move!=='Static'?'<span class="pill">'+esc(f.move)+'</span>':'')
       +'<span class="pill '+PRIORITY[f.priority].cls+'">'+PRIORITY[f.priority].lbl+'</span></div>'
     +'<div class="desc'+(f.desc?'':' muted')+'">'+esc(f.desc||'No description')+'</div>'
     +(sc&&boardScene==='all'?'<div class="tiny muted">'+esc(sceneLabel(sc))+'</div>':'')
     +'<div class="foot"><div class="acts" style="opacity:1">'
       +'<button class="btn sm gh" data-act="frame-move" data-f="'+f.id+'" data-d="-1">←</button>'
       +'<button class="btn sm gh" data-act="frame-move" data-f="'+f.id+'" data-d="1">→</button></div>'
     +'<div class="acts" style="opacity:1"><button class="btn sm gh" data-act="shot-edit" data-f="'+f.id+'">Edit</button>'
       +'<button class="btn sm gh danger" data-act="shot-del" data-f="'+f.id+'">✕</button></div></div></div></div>';
  }).join('')+'</div>';
  return h;
}

     +(c.notes?'<div class="tiny muted" style="margin-top:9px;white-space:pre-wrap">'+esc(c.notes)+'</div>':'')

     +sd.map(d=>'<th>'+esc(d.date.slice(5))+'</th>').join('')+'<th>Days</th></tr></thead><tbody>'

  }
  return h;
}

/* ---------------- CREW ---------------- */
function vCrew(){
  const p=P(),t=crewTier,groups=crewFor(t),es=essentialStats(p);
  const spec=requiredSpecialists(p);
  let h='<div class="head"><h1>Crew</h1><div class="sub">What breaks if the chair is empty.</div></div>';
  h+='<div class="seg" style="margin-bottom:8px">'+TIERS.map((x,i)=>
    '<button data-act="tier" data-i="'+i+'" class="'+(i===t?'on':'')+'">'+esc(x.name)+'</button>').join('')+'</div>'
   +'<div class="muted tiny" style="margin-bottom:16px">'+esc(TIERS[t].blurb)
   +(t===p.tier?' · your project’s scale':' · <button class="btn sm gh" data-act="settier" data-i="'+t+'">Make this the project scale</button>')+'</div>';

  if(spec.length){
    const bad=spec.filter(x=>!x.held);
    h+='<div class="card" style="margin-bottom:16px'+(bad.length?';border-color:color-mix(in srgb,var(--bad) 45%,var(--line))':'')+'">'
     +'<h3>Your script demands these</h3>'
     +'<div class="muted tiny" style="margin:5px 0 11px">Taken straight from the flags on your scenes. Not a budget question — if the scene exists, the hire exists.</div>'
     +'<div class="chips">'+spec.map(x=>'<span class="pill '+(x.held?'good':'bad')+'">'+esc(x.role.n)
       +' · sc '+esc(x.scenes.slice(0,3).join(', '))+'</span>').join('')+'</div></div>';
  }

  h+='<div class="card" style="margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">'
   +'<div class="ring" style="--p:'+(es.need?Math.round(es.have/es.need*100):0)+'"><span>'+(es.need?Math.round(es.have/es.need*100):0)+'</span></div>'
   +'<div style="flex:1;min-width:200px"><h3>'+es.have+' of '+es.need+' essential roles filled</h3>'
   +'<div class="muted tiny" style="margin-top:3px">Pencilled and Confirmed count. Scale: '+esc(TIERS[p.tier].name)+'.</div></div>'
   +'<div class="seg">'+[['all','All'],['ess','Essential'],['gaps','Gaps']].map(([k,l])=>
     '<button data-act="crewfilter" data-f="'+k+'" class="'+(crewFilter===k?'on':'')+'">'+l+'</button>').join('')+'</div></div>';

  let opened=false;
  groups.forEach(g=>{
    let roles=g.roles;
    if(crewFilter==='ess')roles=roles.filter(r=>r.t[t]>=3);
    if(crewFilter==='gaps')roles=roles.filter(r=>r.t[t]>=3&&!['confirmed','held'].includes((p.crew[r.id]||{}).status));
    if(!roles.length)return;
    const filled=g.roles.filter(r=>['confirmed','held'].includes((p.crew[r.id]||{}).status)).length;
    const area=areaOfDept(g.dept),off=delegated(p,area),nm=ownerName(p,area);
    const gaps=g.roles.filter(r=>r.t[t]>=3).length-filled;
    const open=!off&&!opened&&gaps>0;if(open)opened=true;
    h+='<details class="grp"'+(open?' open':'')+'><summary>'+esc(g.dept)
     +(off?' <span class="pill good">'+esc(nm||'handed over')+'</span>':'')
     +'<span class="n">'+filled+'/'+g.roles.length+' filled</span></summary>';
    roles.forEach(r=>{
      const lv=LEVELS[r.t[t]],c=p.crew[r.id]||{status:'needed',person:''};
      const per=S.people.find(x=>x.id===c.person);
      const req=spec.find(x=>x.rid===r.id);
      h+='<div class="crole"><div class="main"><div class="nm">'+esc(r.n)
       +' <span class="pill '+lv.cls+'">'+lv.lbl+'</span>'
       +(req?'<span class="pill bad">your script needs this</span>':'')
       +(r.id==='director'?'<span class="pill">you</span>':'')+'</div>'
       +'<div class="why">'+esc(r.why)+'</div>'
       +(r.skip==='-'?'':'<div class="skip">Without them: '+esc(r.skip)+'</div>')
       +'</div><div class="assign">'
       +'<select data-act="crew-person" data-r="'+r.id+'"><option value="">— nobody yet —</option>'
         +S.people.map(pp=>'<option value="'+pp.id+'"'+(pp.id===c.person?' selected':'')+'>'+esc(pp.name)+'</option>').join('')+'</select>'
       +'<select data-act="crew-status" data-r="'+r.id+'">'+Object.entries(CREW_STATUS).map(([k,l])=>
         '<option value="'+k+'"'+(k===c.status?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'
       +(per&&per.phone?'<span class="pill">'+esc(per.phone)+'</span>':'')+'</div></div>';
    });
    h+='</details>';
  });
  h+='<div class="muted tiny" style="margin-top:20px;max-width:66ch"><b>Never economise on three, at any size:</b> the 1st AD (so you can direct instead of clock-watch), the sound mixer (audiences forgive grain, never mud), and whoever backs up the cards twice a night.</div>';
  return h;
}

/* ---------------- SCHEDULE ---------------- */
function vSched(){
  const p=P();
  const up=[];
  p.days.forEach(d=>up.push({date:d.date,type:'day',o:d}));
  p.tasks.filter(t=>!t.done&&t.due).forEach(t=>up.push({date:t.due,type:'task',o:t}));
  up.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const future=up.filter(x=>x.date>=today()),past=up.filter(x=>x.date<today());

  let h='<div class="head"><h1>Schedule</h1><div class="sub">Assign scenes to a day; the rest is worked out.</div></div>'
   +'<div class="btnrow" style="margin-bottom:16px"><button class="btn pri" data-act="day-new">＋ Add day</button>'
   +'<button class="btn" data-act="task-new">＋ Dated task</button></div>';

  if(past.length)h+='<div class="card" style="margin-bottom:16px"><h3>'+past.length+' date'+(past.length>1?'s have':' has')+' passed</h3>'
   +'<div class="muted tiny" style="margin:5px 0 11px">Move them or bin them. Leaving them there just makes the list lie to you.</div>'
   +past.slice(0,8).map(x=>'<div style="display:flex;gap:10px;align-items:center;padding:5px 0;flex-wrap:wrap">'
     +'<span class="pill warn">'+esc(x.date)+'</span><span style="flex:1;min-width:160px">'
     +esc(x.type==='day'?(x.o.type||'Shoot')+' day':x.o.title)+'</span>'
     +(x.type==='task'?'<button class="btn sm" data-act="resched" data-t="'+x.o.id+'">Move to today</button>':'')+'</div>').join('')+'</div>';

  if(!future.length)return h+'<div class="empty">Nothing dated ahead. Add your shoot days once the 1st AD has built the schedule.</div>';

  h+=future.map(x=>{
    const inD=Math.round((new Date(x.date)-new Date(today()))/864e5);
    const when=inD===0?'today':inD===1?'tomorrow':'in '+inD+' days';
    if(x.type!=='day')return '<div class="item"><div class="grow"><div class="ttl">'+esc(x.o.title)+'</div>'
      +'<div class="tiny muted">'+esc(x.date)+' · '+when+'</div></div>'
      +'<div class="acts"><button class="btn sm gh" data-act="task-edit" data-t="'+x.o.id+'">Edit</button></div></div>';
    const d=x.o,L=dayLoad(p,d);
    const locs=L.locs.map(id=>(p.locations.find(l=>l.id===id)||{}).name).filter(Boolean);
    return '<div class="card" style="margin-top:10px"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">'
     +'<div style="flex:1;min-width:220px"><h2>'+esc(d.type||'Shoot')+' · '+esc(d.date)+'</h2>'
     +'<div class="muted tiny" style="margin-top:3px">'+when+' · call '+esc(d.call||'TBC')
     +(d.wrap?' · wrap '+esc(d.wrap):'')+(locs.length?' · '+esc(locs.join(', ')):'')+'</div></div>'
     +'<div class="acts" style="opacity:1">'
     +(d.type==='Shoot'?'<button class="btn sm" data-act="callsheet" data-d="'+d.id+'">Call sheet</button>':'')
     +'<button class="btn sm gh" data-act="day-edit" data-d="'+d.id+'">Edit</button>'
     +'<button class="btn sm gh danger" data-act="day-del" data-d="'+d.id+'">✕</button></div></div>'
     +(L.scenes.length?'<div class="chips" style="margin-top:11px">'
       +L.scenes.map(s=>'<span class="pill">'+esc(s.no?'Sc '+s.no:s.heading)+'</span>').join('')
       +'<span class="pill ess">'+L.setups+' setups</span>'
       +'<span class="pill">'+L.pages.toFixed(1)+' pages</span>'
       +'<span class="pill'+(L.over?' warn':'')+'">~'+Math.floor(L.mins/60)+'h'+(L.mins%60?' '+(L.mins%60)+'m':'')+' shooting</span>'
       +L.cast.map(id=>'<span class="pill">'+esc(charName(p,id))+'</span>').join('')
       +L.flags.map(f=>'<span class="pill cond">'+esc(f)+'</span>').join('')
       +'</div>':'<div class="tiny muted" style="margin-top:10px">No scenes assigned yet.</div>')
     +(L.over?'<div class="tiny" style="margin-top:10px;color:var(--warn)">That is more shooting than this day length allows once you account for lunch, resets and moves. Cut, or add a day.</div>':'')
     +(d.notes?'<div class="tiny muted" style="margin-top:9px;white-space:pre-wrap">'+esc(d.notes)+'</div>':'')+'</div>';
  }).join('');
  return h;
}

/* ---------------- BUDGET & KIT ---------------- */
function vBudget(){
  const p=P(),off=delegated(p,'money-paperwork');
  const total=parseFloat(p.budgetTotal)||0;
  const planned=p.budget.reduce((a,b)=>a+(parseFloat(b.planned)||0),0);
  const actual=p.budget.reduce((a,b)=>a+(parseFloat(b.actual)||0),0);
  const cont=total*(p.contingencyPct||0)/100;
  const spendable=total-cont;
  const money=n=>(n||0).toLocaleString(undefined,{maximumFractionDigits:0});

  let h='<div class="head"><h1>Budget &amp; kit</h1>'
   +'<div class="sub">Enough to stop money being a background hum.</div></div>';
  if(off)h+='<div class="card" style="margin-bottom:16px"><div class="chips"><span class="pill good">Handed to '
   +esc(ownerName(p,'money-paperwork')||'someone')+'</span></div>'
   +'<div class="tiny muted" style="margin-top:8px">Kept visible so you know roughly where you are.</div></div>';

  h+='<div class="btnrow" style="margin-bottom:16px"><button class="btn pri" data-act="line-new">＋ Add line</button>'
   +'<button class="btn" data-act="budget-set">Set the total</button></div>';

  if(total)h+='<div class="card" style="margin-bottom:16px">'
   +'<div class="grid g3">'+stat(money(total),'total you have')+stat(money(spendable),'spendable after contingency')
   +stat(money(planned),'planned')+stat(money(actual),'actually spent')+'</div>'
   +'<div class="bar" style="margin-top:14px"><i class="'+(planned>spendable?'over':'')+'" style="width:'
   +Math.min(100,spendable?planned/spendable*100:0)+'%"></i></div>'
   +'<div class="tiny muted" style="margin-top:8px">'
   +(planned>spendable?'You are planning to spend more than you have once contingency is held back.':
     'Contingency of '+money(cont)+' is held back and is not yours to spend.')+'</div></div>';

  if(!p.budget.length)return h+'<div class="empty">Nothing budgeted yet. Start with the four that always cost more than you think: food, transport, insurance, and giving people petrol money.</div>';

  const cats=[...new Set(p.budget.map(b=>b.cat))];
  cats.forEach(c=>{
    const rows=p.budget.filter(b=>b.cat===c);
    const sub=rows.reduce((a,b)=>a+(parseFloat(b.actual)||parseFloat(b.planned)||0),0);
    h+='<details class="grp"><summary>'+esc(c||'Other')+'<span class="n">'+money(sub)+' · '+rows.length+' lines</span></summary>'
     +rows.map(b=>'<div class="prepitem"><div class="t"><b>'+esc(b.item)+'</b>'
       +(b.who?' <span class="muted">· '+esc(b.who)+'</span>':'')
       +'<div class="chips" style="margin-top:5px">'
       +(b.planned?'<span class="pill">planned '+money(parseFloat(b.planned))+'</span>':'')

}

/* ---------------- TIMELINE (all projects, months at a glance) ---------------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function vTimeline(){
  const t0=today();
  const [y0,m0]=t0.split('-').map(Number);
  const addM=n=>new Date(Date.UTC(y0,m0-1+n,1)).toISOString().slice(0,10);
  const items=[];
  S.projects.forEach(p=>{
    p.tasks.filter(t=>t.due).forEach(t=>items.push({date:t.due,kind:t.milestone?'ms':'task',o:t,p}));
    p.days.forEach(d=>items.push({date:d.date,kind:'day',o:d,p}));
  });
  let last=t0;
  items.forEach(x=>{if(x.date>last)last=x.date;});
  S.projects.forEach(p=>Object.values(p.phaseDates||{}).forEach(d=>{if(d&&d>last)last=d;}));
  const [yl,ml]=last.split('-').map(Number);
  let n=Math.min(9,Math.max(4,(yl-y0)*12+(ml-m0)+2));
  const start=addM(0),end=addM(n);
  const span=new Date(end)-new Date(start);
  const pct=d=>Math.max(0,Math.min(100,(new Date(d)-new Date(start))/span*100));
  const fmt=d=>{const [y,m,dd]=d.split('-');return MON[+m-1]+' '+(+dd);};

  let h='<div class="head"><h1>Months</h1><div class="sub">Every film, every date, one screen. Bars are phases; diamonds are milestones; dots are days on set.</div></div>'
   +'<div class="btnrow" style="margin-bottom:18px"><button class="btn pri" data-act="ms-new">◆ Add milestone</button>'
   +'<button class="btn" data-act="day-new">＋ Add day</button>'
   +'<button class="btn gh" data-act="tl-phases" data-p="'+P().id+'">Phase dates for '+esc(P().title)+'</button></div>';

  h+='<div class="card" style="padding:14px 14px 4px"><div class="tl"><div class="tlg" style="grid-template-columns:118px repeat('+n+',minmax(92px,1fr))">';
  h+='<div></div>'+[...Array(n)].map((_,i)=>{const d=addM(i);const [y,m]=d.split('-');
    return '<div class="mh'+(i===0?' cur':'')+'">'+MON[+m-1]+(i===0||m==='01'?' ’'+y.slice(2):'')+'</div>';}).join('');
  S.projects.forEach(p=>{
    const ph=Object.entries(p.phaseDates||{}).filter(([i,d])=>d).map(([i,d])=>({i:+i,d})).sort((a,b)=>a.d.localeCompare(b.d));
    h+='<div class="lb"><b title="'+esc(p.title)+'">'+esc(p.title)+'</b>'
     +'<button data-act="tl-phases" data-p="'+p.id+'">'+(ph.length?esc(PHASES[p.phase]||''):'set phase dates →')+'</button></div>';
    h+='<div class="lane" style="--cw:calc(100%/'+n+')">';
    ph.forEach((x,k)=>{
      const l=pct(x.d),r=ph[k+1]?pct(ph[k+1].d):100;
      if(r-l<0.4)return;
      h+='<div class="ph'+(ph[k+1]&&ph[k+1].d<=t0?' past':'')+'" style="left:'+l.toFixed(2)+'%;width:'+(r-l).toFixed(2)+'%;--c:var('+(PHASE_COL[x.i]||'--accent')+')" title="'+esc(PHASES[x.i])+' from '+fmt(x.d)+'">'+esc(PHASES[x.i])+'</div>';
    });
    p.days.forEach(d=>{if(d.date<start||d.date>=end)return;
      const c=d.type==='Pick-ups'?' pk':(d.type==='Recce'||d.type==='Rehearsal')?' rc':'';
      h+='<button class="dy'+c+'" style="left:'+pct(d.date).toFixed(2)+'%" title="'+esc((d.type||'Shoot')+' · '+fmt(d.date))+'" data-act="tl-day" data-p="'+p.id+'" data-d="'+d.id+'"></button>';});
    p.tasks.filter(t=>t.milestone&&t.due&&t.due>=start&&t.due<end).forEach(t=>{
      h+='<button class="ms'+(t.done?' done':'')+'" style="left:'+pct(t.due).toFixed(2)+'%" title="'+esc(fmt(t.due)+' · '+t.title)+'" data-act="tl-task" data-p="'+p.id+'" data-t="'+t.id+'"></button>';});
    h+='<div class="now" style="left:'+pct(t0).toFixed(2)+'%"></div></div>';
  });
  h+='</div></div></div>';

  const up=items.filter(x=>x.date>=t0||(x.kind==='ms'&&!x.o.done)).sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='ms'?-1:1));
  if(!up.length)return h+'<div class="empty" style="margin-top:18px">Nothing dated yet. Add a milestone — the date the whole plan hinges on.</div>';
  h+='<div class="up">';let cur='';
  up.forEach(x=>{
    const m=x.date.slice(0,7);
    if(m!==cur){cur=m;const [y,mm]=m.split('-');h+='<div class="mo"><h3>'+MON[+mm-1]+' '+y+'</h3><div class="line"></div></div>';}
    const late=x.date<t0;
    if(x.kind==='day'){
      h+='<div class="row"><span class="d">'+fmt(x.date)+'</span><span class="k" style="color:var(--amber)">●</span>'
       +'<span class="t">'+esc(x.o.type||'Shoot')+(x.o.call?' · call '+esc(x.o.call):'')+(x.o.notes?' <span class="tiny muted">— '+esc(x.o.notes.split('\n')[0])+'</span>':'')+'</span>'
       +'<span class="pj">'+esc(x.p.title)+'</span><button class="btn sm gh" data-act="tl-day" data-p="'+x.p.id+'" data-d="'+x.o.id+'">Edit</button></div>';
    }else{
      h+='<div class="row'+(x.o.done?' done':'')+'"><span class="d'+(x.date===t0?' today':'')+'" style="'+(late?'color:var(--warn)':'')+'">'+fmt(x.date)+'</span>'
       +'<span class="k" style="color:var(--accent)">'+(x.kind==='ms'?'◆':'·')+'</span>'
       +'<button class="t" style="text-align:left" data-act="tl-task" data-p="'+x.p.id+'" data-t="'+x.o.id+'">'+esc(x.o.title)+(late&&!x.o.done?' <span class="pill warn">passed</span>':'')+'</button>'
       +'<span class="pj">'+esc(x.p.title)+'</span>'
       +'<button class="chk'+(x.o.done?' on':'')+'" data-act="tl-done" data-p="'+x.p.id+'" data-t="'+x.o.id+'">✓</button></div>';
    }
  });
  return h+'</div>';
}
function phaseForm(p){
  const v={};PHASES.forEach((_,i)=>v['ph'+i]=(p.phaseDates||{})[i]||'');
  openForm('Phase dates — '+p.title,PHASES.map((ph,i)=>({k:'ph'+i,label:ph,type:'date'})),v,o=>{
    p.phaseDates={};PHASES.forEach((_,i)=>{if(o['ph'+i])p.phaseDates[i]=o['ph'+i];});
    const t=today();let cur=-1;Object.entries(p.phaseDates).forEach(([i,d])=>{if(d<=t&&+i>cur)cur=+i;});
    if(cur>=0)p.phase=cur;
    save();render();},
   'Only the start date of each phase. A phase runs until the next dated one begins. Leave blank anything that does not apply. The current phase is set from today’s date.');
}

function pickFiles(fn){
  const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;
  i.onchange=()=>fn([...i.files]);i.click();
}
async function addFrames(files){
  files=files.filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const p=P();toast('Processing '+files.length+' image'+(files.length>1?'s':'')+'…');
  let n=0;
  for(const f of files){
    try{
      const key='img_'+uid();await imgPut(key,await shrink(f,1400,0.72));
      p.shots.push({id:uid(),scene:(boardScene==='all'?'':boardScene),setup:'',size:'—',angle:'',
        move:'Static',lens:'',subject:'',desc:'',priority:'should',img:key,got:false,order:p.shots.length});
      n++;
    }catch(e){}
  }
  save();render();
  toast(n+' shot'+(n===1?'':'s')+' added to the shot list. Give them a size and a priority when you have a minute.');
}
async function addPhotos(locId,files){
  files=files.filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const l=P().locations.find(x=>x.id===locId);if(!l)return;
  l.photos=l.photos||[];
  for(const f of files){try{const key='img_'+uid();await imgPut(key,await shrink(f,1400,0.72));l.photos.push(key);}catch(e){}}
  save();render();toast('Recce photos added.');
}
function wireDrop(){
  const d=document.getElementById('drop');if(!d)return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('hot');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('hot');}));
  d.addEventListener('drop',ev=>{if(ev.dataTransfer&&ev.dataTransfer.files)addFrames([...ev.dataTransfer.files]);});
}

async function printBoard(){

   +esc(new Date().toDateString())+'</div><div class="g">'

     return '<figure><div class="n">'+esc(shotNo(p,f))+(sc?' · '+esc(sc.heading||''):'')+'</div>'

function printCallSheet(dayId){
  const p=P(),d=p.days.find(x=>x.id===dayId);if(!d)return;
  const L=dayLoad(p,d);
  const sd=p.days.filter(x=>x.type==='Shoot').sort((a,b)=>a.date.localeCompare(b.date));
  const dayNo=sd.findIndex(x=>x.id===d.id)+1;
  const locs=L.locs.map(id=>p.locations.find(l=>l.id===id)).filter(Boolean);
  const crewRows=Object.entries(p.crew).filter(([,c])=>c.person&&['confirmed','held'].includes(c.status))
    .map(([rid,c])=>{const per=S.people.find(x=>x.id===c.person);
      return {role:(ROLE_BY_ID[rid]||{}).n||rid,name:per?per.name:'',phone:per?per.phone||'':''};});
  const safety=[...new Set(L.flags)].map(f=>{
    const roles=(FLAG_ROLES[f]||[]).map(r=>(ROLE_BY_ID[r]||{}).n).filter(Boolean);
    return f+(roles.length?' — '+roles.join(' and ')+' must be present':'');});

  const body='<h1>'+esc(p.title)+'</h1>'
   +'<div class="meta">CALL SHEET · '+esc(d.type||'Shoot')+' day '+dayNo+' of '+sd.length+' · '+esc(d.date)
   +' · issued '+esc(new Date().toDateString())+'</div>'
   +'<table><tr><th style="width:110px">Unit call</th><td><b style="font-size:15px">'+esc(d.call||'TBC')+'</b></td>'
   +'<th style="width:110px">Est. wrap</th><td>'+esc(d.wrap||'TBC')+'</td></tr>'
   +'<tr><th>Location</th><td colspan="3">'+(locs.length?locs.map(l=>esc(l.name)+(l.address?' — '+esc(l.address):'')).join('<br>'):'TBC')+'</td></tr>'
   +'<tr><th>Nearest hospital</th><td colspan="3">'+esc(locs.map(l=>l.hospital).filter(Boolean).join(' / ')||'TO BE CONFIRMED BEFORE CALL')+'</td></tr>'
   +'<tr><th>Weather</th><td colspan="3">'+esc(d.weather||'—')+'</td></tr>'
   +'<tr><th>Day totals</th><td colspan="3">'+L.scenes.length+' scenes · '+L.setups+' setups · '
   +L.pages.toFixed(1)+' pages · roughly '+Math.floor(L.mins/60)+'h '+(L.mins%60)+'m of shooting</td></tr></table>'
