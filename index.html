/* ---------------- backup ---------------- */
function download(name,text){
  const b=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function doExport(){
  toast('Gathering storyboard images…');await prune();
  const images={};for(const k of await imgKeys())if(String(k).startsWith('img_'))images[k]=await imgGet(k);
  const json=JSON.stringify({...S,__images:images,__exported:nowISO()});
  download('slate-backup-'+today()+'.json',json);
  S.lastManualBackup=nowISO();save();
  toast('Backup downloaded ('+(json.length/1048576).toFixed(1)+' MB). Keep it somewhere that is not this laptop.');
}
function doImport(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{try{
      const d=JSON.parse(r.result);if(!d.projects)throw 0;
      const imgs=d.__images||{};delete d.__images;delete d.__exported;
      for(const k in imgs)await imgPut(k,imgs[k]);
      const old=S;S=d;S.projects=S.projects.map(migrate);save();render();
      toast('Restored from backup','Undo',()=>{S=old;save();render();});
    }catch(e){toast('That file did not look like a Slate backup.');}};
    r.readAsText(f);};
  i.click();
}
async function storageReport(){
  const dropped=await prune();const keys=(await imgKeys()).filter(k=>String(k).startsWith('img_'));
  let bytes=0;for(const k of keys){const v=await imgGet(k);if(v)bytes+=v.length;}
  let q='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    if(e.quota)q=' of about '+(e.quota/1073741824).toFixed(1)+' GB available';}}catch(e){}
  toast(keys.length+' images using '+(bytes/1048576).toFixed(1)+' MB'+q
    +(dropped?' · tidied away '+dropped+' from deleted shots':'')+'.');
}


/* ============ Supabase sync (plain REST — no library, works offline-first) ============ */
const SB_KEY='slate.sb';
let sb=null,sbState='off',sbTimer=null,sbBusy=false;
function sbLoad(){try{sb=JSON.parse(localStorage.getItem(SB_KEY))||null;}catch(e){sb=null;}
  if(sb&&sb.url&&sb.anon)sbState=sb.token?'on':'signedout';}
function sbSave(){try{localStorage.setItem(SB_KEY,JSON.stringify(sb));}catch(e){}}
function sbOn(){return sb&&sb.url&&sb.anon&&sb.token;}

async function sbCall(path,opts,noAuth){
  opts=opts||{};
  const h=Object.assign({'apikey':sb.anon,'Content-Type':'application/json'},opts.headers||{});
  if(!noAuth&&sb.token)h['Authorization']='Bearer '+sb.token;
  let r=await fetch(sb.url+path,Object.assign({},opts,{headers:h}));
  if(r.status===401&&!noAuth&&sb.refresh&&await sbRefresh()){
    h['Authorization']='Bearer '+sb.token;
    r=await fetch(sb.url+path,Object.assign({},opts,{headers:h}));
  }
  return r;
}
async function sbRefresh(){
  try{
    const r=await fetch(sb.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{'apikey':sb.anon,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:sb.refresh})});
    if(!r.ok)return false;
    const d=await r.json();
    sb.token=d.access_token;sb.refresh=d.refresh_token;sb.uid=(d.user||{}).id||sb.uid;sbSave();
    return true;
  }catch(e){return false;}
}
async function sbSendCode(email){
  const r=await sbCall('/auth/v1/otp',{method:'POST',
    body:JSON.stringify({email:email,create_user:true})},true);
  if(!r.ok)throw new Error((await r.text()).slice(0,140));
}
async function sbVerify(email,code){
  const r=await sbCall('/auth/v1/verify',{method:'POST',
    body:JSON.stringify({email:email,token:code,type:'email'})},true);
  if(!r.ok)throw new Error('That code was not accepted.');
  const d=await r.json();
  sb.token=d.access_token;sb.refresh=d.refresh_token;sb.email=email;
  sb.uid=(d.user||{}).id;sbState='on';sbSave();
}
function sbSignOut(){if(sb){sb.token=sb.refresh=sb.uid=null;sbSave();}sbState='signedout';render();}

async function sbPull(){
  if(!sbOn())return null;
  const r=await sbCall('/rest/v1/slate?select=data,rev,updated_at&limit=1');
  if(!r.ok)return null;
  const rows=await r.json();
  return rows[0]||null;
}
async function sbPush(){
  if(!sbOn()||sbBusy)return;
  sbBusy=true;
  try{
    S.rev=(S.rev||0)+1;
    const r=await sbCall('/rest/v1/slate',{method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({user_id:sb.uid,data:S,rev:S.rev,updated_at:nowISO()})});
    if(r.ok){S.syncedRev=S.rev;S.syncedAt=nowISO();sbState='on';
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      sbPushImages();}
    else sbState='error';
  }catch(e){sbState='error';}
  sbBusy=false;updateSyncUI();
}
function sbQueue(){if(!sbOn())return;clearTimeout(sbTimer);sbTimer=setTimeout(sbPush,8000);}

/* images ride in Supabase Storage, one object per key, uploaded once */
async function sbPushImages(){
  if(!sbOn())return;
  S.sentImages=S.sentImages||[];
  for(const k of liveKeys()){
    if(S.sentImages.includes(k))continue;
    const data=await imgGet(k);if(!data)continue;
    try{
      const blob=await(await fetch(data)).blob();
      const r=await fetch(sb.url+'/storage/v1/object/slate-images/'+sb.uid+'/'+k+'.jpg',
        {method:'POST',headers:{'apikey':sb.anon,'Authorization':'Bearer '+sb.token,
          'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
      if(r.ok||r.status===409)S.sentImages.push(k);
    }catch(e){}
  }
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
async function sbGetImage(k){
  if(!sbOn())return null;
  try{
    const r=await fetch(sb.url+'/storage/v1/object/authenticated/slate-images/'+sb.uid+'/'+k+'.jpg',
      {headers:{'apikey':sb.anon,'Authorization':'Bearer '+sb.token}});
    if(!r.ok)return null;
    const b=await r.blob();
    return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});
  }catch(e){return null;}
}
async function sbSync(silent){
  if(!sbOn())return;
  const remote=await sbPull();
  if(!remote){await sbPush();return;}
  const localDirty=(S.rev||0)!==(S.syncedRev||0);
  const remoteNewer=!S.syncedAt||remote.updated_at>S.syncedAt;
  if(remoteNewer&&localDirty){
    sbState='conflict';updateSyncUI();
    toast('This device and the other one have both changed since they last agreed.','Choose',()=>{
      actionSheet('Two versions exist',[
        {n:'Keep what is on THIS device',act:'sync-keep-local'},
        {n:'Take the other device’s version',act:'sync-take-remote'}]);
    });
    return;
  }
  if(remoteNewer){await sbAdopt(remote);if(!silent)toast('Updated from your other device.');}
  else if(localDirty)await sbPush();
  else{sbState='on';updateSyncUI();}
}
async function sbAdopt(remote){
  const d=remote.data;if(!d||!d.projects)return;
  S=d;S.projects=S.projects.map(migrate);
  S.rev=remote.rev;S.syncedRev=remote.rev;S.syncedAt=remote.updated_at;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  sbState='on';render();
}
function updateSyncUI(){
  const t=document.getElementById('synctxt'),d=document.getElementById('syncdot');
  if(!t)return;
  const m={off:['Sync not set up','var(--dimmer)'],signedout:['Sync · sign in','var(--warn)'],
    on:[S.syncedAt?'Synced '+new Date(S.syncedAt).toTimeString().slice(0,5):'Synced','var(--good)'],
    conflict:['Two versions — tap','var(--warn)'],error:['Sync failed','var(--bad)']};
  const v=m[sbState]||m.off;t.textContent=v[0];d.style.background=v[1];
}
function syncSetup(){
  openForm('Connect sync',[
    {k:'url',label:'Supabase project URL',ph:'https://abcdefgh.supabase.co',
      hint:'Supabase dashboard → Project Settings → Data API → Project URL'},
    {k:'anon',label:'Anon public key',ph:'eyJhbGciOi…',
      hint:'Same page, "anon public". It is safe in this file — your data is protected by row-level security, not by hiding this.'}
  ],sb||{},o=>{
    if(!o.url.trim()||!o.anon.trim())return;
    sb=Object.assign(sb||{},{url:o.url.trim().replace(/\/+$/,''),anon:o.anon.trim()});
    sbState='signedout';sbSave();render();syncSignIn();
  },'One-off setup. Do this on the Mac first, then repeat the same two values on your phone and sign in with the same email — that is what ties the two together.');
}
function syncSignIn(){
  openForm('Sign in',[{k:'email',label:'Your email',type:'email',ph:'you@example.com'}],
    {email:(sb&&sb.email)||S.email||''},async o=>{
    const em=o.email.trim();if(!em)return;
    toast('Sending a code to '+em+'…');
    try{await sbSendCode(em);}catch(e){return toast('Could not send the code. Check the URL and key.');}
    openForm('Check your email',[{k:'code',label:'Six-digit code',ph:'123456'}],{},async v=>{
      try{await sbVerify(em,v.code.trim());await sbSync(true);render();
        toast('Signed in. This device is now in sync.');}
      catch(e){toast(e.message||'That code was not accepted.');}
    },'Codes expire after an hour. Use the same email on every device.');
  },'You get a six-digit code by email — no password, and no link that would open in the wrong app.');
}

      {k:'budgetTotal',label:'Total you actually have',type:'number'},
      {k:'contingencyPct',label:'Contingency held back (%)',type:'number',hint:'Ten per cent minimum. This is not yours to spend.'},
      {k:'minPerSetup',label:'Minutes per setup',type:'number',hint:'Used to estimate day length. 30 is honest for a small crew; 20 if you are fast and simple.'}
      ],p,o=>{p.budgetTotal=o.budgetTotal;p.contingencyPct=+o.contingencyPct||0;p.minPerSetup=+o.minPerSetup||30;save();render();});break;
    case 'proj-new':projForm(null);break;
    case 'proj-edit':projForm(S.projects.find(x=>x.id===b.dataset.p));break;
    case 'proj-open':S.activeProject=b.dataset.p;crewTier=P().tier;boardScene=shotScene='all';save();go('now');break;
    case 'proj-del':{const i=S.projects.findIndex(x=>x.id===b.dataset.p);
      if(S.projects[i].id===S.activeProject)S.activeProject=S.projects.find(x=>x.id!==b.dataset.p).id;
      softDelete('Project',S.projects,i);break;}
    case 'modal-close':closeModal();break;
    case 'modal-save':if(modalSave)modalSave();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const p=P();
  if(el.dataset.act==='crew-person'||el.dataset.act==='crew-status'){
    const r=el.dataset.r;p.crew[r]=p.crew[r]||{status:'needed',person:''};
    if(el.dataset.act==='crew-person'){p.crew[r].person=el.value;
      if(el.value&&p.crew[r].status==='needed')p.crew[r].status='asked';}
    else p.crew[r].status=el.value;
    save();render();
  }
});
document.getElementById('projsel').addEventListener('change',e=>{
  if(e.target.value==='__new'){e.target.value=S.activeProject;projForm(null);return;}
  S.activeProject=e.target.value;crewTier=P().tier;boardScene=shotScene='all';save();go('now');
});
document.getElementById('veil').addEventListener('mousedown',e=>{if(e.target.id==='veil')closeModal();});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='Escape'){if(document.getElementById('veil').classList.contains('on'))closeModal();
    else if(shootMode){shootMode=false;render();}return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();save();toast('Saved.');return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&modalSave){e.preventDefault();modalSave();return;}
  if(typing)return;
  if(e.key==='c'||e.key==='C'){e.preventDefault();document.getElementById('cap').click();}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cloudWrite();sbPush();}else if(sbOn())sbSync(true);});
window.addEventListener('beforeunload',()=>{try{if(!memOnly)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});

/* ---------------- go ---------------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
sbLoad();load();crewTier=P().tier;render();save();cloudRestore();
if(sbOn())sbSync(true);
if(memOnly)toast('This browser is blocking local storage here. Open Slate through "Start Slate.command" so your work is kept.');
</script>
</body>
</html>
